<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRODE HM 2026</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0a192f,#112240);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:30px;
}

.header h1{
font-size:48px;
color:#FFD700;
}

.header p{
color:#ccc;
margin-top:10px;
}

.card{
background:#1c2b45;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin-top:10px;
margin-bottom:15px;
}

.match{
display:grid;
grid-template-columns:1fr 70px 70px 1fr;
gap:10px;
align-items:center;
margin-bottom:15px;
}

.score{
padding:10px;
text-align:center;
font-size:18px;
}

button{
width:100%;
padding:15px;
background:#FFD700;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border:1px solid #334;
text-align:center;
}

th{
background:#FFD700;
color:black;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🏆 PRODE HM 2026</h1>
<p>Mundial de Selecciones - Fecha 1</p>
</div>

<div class="card">

<h2>Tu Pronóstico</h2>

<input id="nombre" placeholder="Ingresá tu nombre">

<div id="partidos"></div>

<button onclick="guardarPronostico()">
Guardar Pronóstico
</button>

</div>

<div class="card">

<h2>Ranking</h2>

<table>
<thead>
<tr>
<th>Participante</th>
<th>Puntos</th>
</tr>
</thead>
<tbody id="ranking"></tbody>
</table>

</div>

</div>

<script>

const partidos = [
["México","Sudáfrica"],
["Corea del Sur","República Checa"],

["Canadá","Bosnia"],
["Estados Unidos","Paraguay"],

["Qatar","Suiza"],
["Brasil","Marruecos"],
["Haití","Escocia"],
["Australia","Turquía"],

["Alemania","Curazao"],
["Países Bajos","Japón"],
["Costa de Marfil","Ecuador"],
["Suecia","Túnez"],

["España","Cabo Verde"],
["Bélgica","Egipto"],
["Arabia Saudita","Uruguay"],
["Irán","Nueva Zelanda"],

["Francia","Senegal"],
["Irak","Noruega"],
["Argentina","Argelia"],
["Austria","Jordania"],

["Portugal","RD Congo"],
["Inglaterra","Croacia"],
["Ghana","Panamá"],
["Uzbekistán","Colombia"]
];

const contenedor = document.getElementById("partidos");

partidos.forEach((partido,i)=>{

contenedor.innerHTML += `
<div class="match">
<div>${partido[0]}</div>
<input class="score" type="number" min="0" id="l${i}">
<input class="score" type="number" min="0" id="v${i}">
<div>${partido[1]}</div>
</div>
`;

});

function guardarPronostico(){

const nombre =
document.getElementById("nombre").value;

if(nombre==""){
alert("Ingresá tu nombre");
return;
}

let participantes =
JSON.parse(localStorage.getItem("prodeHM")) || [];

participantes.push({
nombre:nombre,
puntos:0
});

localStorage.setItem(
"prodeHM",
JSON.stringify(participantes)
);

mostrarRanking();

alert("Pronóstico guardado correctamente");

}

function mostrarRanking(){

let participantes =
JSON.parse(localStorage.getItem("prodeHM")) || [];

let html="";

participantes.forEach(p=>{

html += `
<tr>
<td>${p.nombre}</td>
<td>${p.puntos}</td>
</tr>
`;

});

document.getElementById("ranking").innerHTML =
html;

}

mostrarRanking();

</script>

</body>
</html>
